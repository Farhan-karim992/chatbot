<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>
     <!-- <script src="https://unpkg.com/supersimpledev/external-library.js"> -->
       
     </script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        // we can replce div with <>
        // we use div for formating purpose
        // now we use prop it helps resue things
      function ChatInput(){
        return (
            // it cannot return 2 element so use div
            
                <>
                 <input placeholder="Type" size="30" />
                 <button>Send</button>
                </>
            
        );
      
      }
      function ChatMessage(props){
        // Another shortvut
        // function ChatMessage({message, sender})
        
        // const message = props.message;
        // const sender = props.sender;
        // shortcut version
        const {message, sender} = props;
        // a shortcut for this line code below
          // if(sender ==="robot"){
          //   return(
          //     <div>
                 
          //         <img src="robot.png" alt="" width ="50" />
          //          {message}
          //   </div>
          //   );
          // };
        return (
               // the shortcut for above code
                <div>
                  {sender === 'robot' && <img src="robot.png" alt="" width ="50" />}
                  {message}
                  {sender === 'user' && <img src="user.png" alt="" width ="50" />}
                </div>
        );
      };
    //   <ChatInput></ChatInput>
    //     <ChatInput  />
     // prop makes our element reuseable
     // component is better way to make app
     function App(){
      const chatMessages = [{
        message : 'Hello Chatbot', 
        sender : 'user',
        key : 'id1'
      }, {
        message : 'HELLO! How can i help you.', 
        sender : 'robot',
        key : 'id2'
      },
    {
      message : 'Can you get me todays date?',
      sender : 'user',
      key : 'id3'
    },
  {
    message : 'Today is 27 September',
    sender : 'robot',
    key : 'id4'
  }]
  // we have just used array and array have a property called map
  // arrow function
    
        return (
          <>
          
          <ChatInput 
        
          />
                {chatMessages.map((chatMessage) => {
            return (
              <ChatMessage 
              message = {chatMessage.message}
              sender = {chatMessage.sender}
              key = {chatMessage.key}
              />
            );

          })}
          
       </>
      );
     }
      // const app = (
       
      // );
      // const button = document.createElement('button');
      // button.inerHTML = 'HELLO'
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
